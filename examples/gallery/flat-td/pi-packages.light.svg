<g class="bb-edge-label map-item"><text class="bb-label control" x="393.3" y="489.3" text-anchor="middle">filters</text></g>
<g class="bb-edge-label map-item"><text class="bb-label control" x="446.7" y="785.6" text-anchor="middle">host provides</text></g>
</g>
<g class="bb-node map-item cat-slate" data-id="install">
<rect class="bb-node-box" x="127.3" y="277" width="250" height="131" rx="7"/>
<circle class="bb-mark" cx="153.3" cy="303" r="4"/>
<text class="bb-kicker" x="164.3" y="307">COMMAND</text>
<text class="bb-node-title" x="149.3" y="335">pi install</text>
<text class="bb-copy" x="149.3" y="360">npm: · git: · ./path</text>
<text class="bb-copy" x="149.3" y="380">-l writes .pi/settings</text>
</g>
<g class="bb-node map-item cat-slate" data-id="settings">
<rect class="bb-node-box" x="516" y="277" width="250" height="131" rx="7"/>
<circle class="bb-mark" cx="542" cy="303" r="4"/>
<text class="bb-kicker" x="553" y="307">CONFIG</text>
<text class="bb-node-title" x="538" y="335">settings.json</text>
<text class="bb-copy" x="538" y="360">packages[] with filters</text>
<text class="bb-copy" x="538" y="380">!glob, +path, -path</text>
</g>
<g class="bb-node map-item cat-sage" data-id="manifest">
<rect class="bb-node-box" x="127.3" y="570" width="250" height="131" rx="7"/>
<circle class="bb-mark" cx="153.3" cy="596" r="4"/>
<text class="bb-kicker" x="164.3" y="600">PACKAGE.JSON</text>
<text class="bb-node-title" x="149.3" y="628">pi manifest</text>
<text class="bb-copy" x="149.3" y="653">extensions, skills</text>
<text class="bb-copy" x="149.3" y="673">prompts, themes</text>
</g>
<g class="bb-node map-item cat-sage" data-id="peers">
<rect class="bb-node-box" x="516" y="570" width="250" height="131" rx="7"/>
<circle class="bb-mark" cx="542" cy="596" r="4"/>
<text class="bb-kicker" x="553" y="600">DEPENDENCIES</text>
<text class="bb-node-title" x="538" y="628">Peer deps</text>
<text class="bb-copy" x="538" y="653">host packages as &quot;*&quot;</text>
<text class="bb-copy" x="538" y="673">never bundled</text>
</g>
<g class="bb-node map-item cat-peach" data-id="ext">
<rect class="bb-node-box" x="127.3" y="863" width="250" height="131" rx="7"/>
<circle class="bb-mark" cx="153.3" cy="889" r="4"/>
<text class="bb-kicker" x="164.3" y="893">EXTENSION</text>
