<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1213 1090" width="1213" height="1090" role="img" aria-labelledby="bb-t bb-d">
<title id="bb-t">How a pi package loads</title><desc id="bb-d">No status tracking and no motion: bowerbird as a plain diagramming tool.</desc>
<style>
text{font-family:Geist,"Geist Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-variant-numeric:tabular-nums}
.bb-title{font-size:36px;font-weight:300;letter-spacing:-.015em}
.bb-subtitle{font-size:14px;font-weight:400}
