<path class="bb-edge data map-item" d="M 377.3 661.7 L 496 661.7 Q 502 661.7 502 667.7 L 502 843 Q 502 849 508 849 L 882.7 849 Q 888.7 849 888.7 855 L 888.7 922.5 Q 888.7 928.5 894.7 928.5 L 904.7 928.5" marker-end="url(#bb-arrow-data)" data-from="manifest" data-to="themes"/>
<path class="bb-edge control map-item" d="M 516 635.5 L 452.7 635.5 Q 446.7 635.5 446.7 641.5 L 446.7 922.5 Q 446.7 928.5 440.7 928.5 L 377.3 928.5" marker-end="url(#bb-arrow-control)" data-from="peers" data-to="ext"/>
