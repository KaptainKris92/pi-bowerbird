<defs><marker id="bb-arrow-data" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="bb-arrow data" d="M 0 1 L 10 5 L 0 9 z"/></marker><marker id="bb-arrow-control" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="bb-arrow control" d="M 0 1 L 10 5 L 0 9 z"/></marker><marker id="bb-arrow-failure" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="bb-arrow failure" d="M 0 1 L 10 5 L 0 9 z"/></marker></defs>
<rect class="bb-canvas" x="0" y="0" width="1213" height="1090"/>
<path class="bb-rule" d="M 40 48 H 62"/>
<text class="bb-kicker-top" x="74" y="52">EXAMPLE · CONCEPT MAP</text>
<text class="bb-title" x="40" y="100">How a pi package loads</text>
<text class="bb-subtitle" x="40" y="130">No status tracking and no motion: bowerbird as a plain diagramming tool.</text>
<g class="bb-zone-group cat-slate">
<rect class="bb-zone cat-slate" x="109.3" y="191" width="674.7" height="235" rx="6"/>
<text class="bb-zone-kicker" x="131.3" y="219">INSTALL + CONFIG</text>
<circle class="bb-mark" cx="136.3" cy="236.5" r="5"/>
<text class="bb-zone-title" x="149.3" y="243">Pi host</text>
</g>
<g class="bb-zone-group cat-sage">
<rect class="bb-zone cat-sage" x="109.3" y="484" width="674.7" height="235" rx="6"/>
<text class="bb-zone-kicker" x="131.3" y="512">NPM, GIT, OR LOCAL</text>
<circle class="bb-mark" cx="136.3" cy="529.5" r="5"/>
<text class="bb-zone-title" x="149.3" y="536">Package</text>
</g>
<g class="bb-zone-group cat-peach">
<rect class="bb-zone cat-peach" x="109.3" y="777" width="1063.4" height="235" rx="6"/>
<text class="bb-zone-kicker" x="131.3" y="805">PER SESSION</text>
<circle class="bb-mark" cx="136.3" cy="822.5" r="5"/>
<text class="bb-zone-title" x="149.3" y="829">Loaded resources</text>
</g>
