<path class="bb-edge data map-item" d="M 252.3 701 L 252.3 777 Q 252.3 783 258.3 783 L 306.1 783 Q 312.1 783 312.1 789 L 312.1 841 Q 312.1 847 306.1 847 L 258.3 847 Q 252.3 847 252.3 853 L 252.3 863" marker-end="url(#bb-arrow-data)" data-from="manifest" data-to="ext"/>
