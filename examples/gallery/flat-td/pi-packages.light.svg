.cat-sage .bb-mark,.bb-mark.cat-sage{fill:#427f61}
.cat-sage .bb-kicker,.cat-sage .bb-zone-kicker{fill:#477d61}
.cat-sage .bb-node-box{fill:#eaefe9;stroke:#b7cdc0}
