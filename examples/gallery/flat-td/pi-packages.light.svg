<text class="bb-copy" x="149.3" y="946">tools, commands</text>
<text class="bb-copy" x="149.3" y="966">event hooks</text>
</g>
<g class="bb-node map-item cat-peach" data-id="skills">
<rect class="bb-node-box" x="516" y="863" width="250" height="131" rx="7"/>
<circle class="bb-mark" cx="542" cy="889" r="4"/>
<text class="bb-kicker" x="553" y="893">SKILL</text>
<text class="bb-node-title" x="538" y="921">Skills</text>
<text class="bb-copy" x="538" y="946">SKILL.md on demand</text>
</g>
<g class="bb-node map-item cat-peach" data-id="themes">
<rect class="bb-node-box" x="904.7" y="863" width="250" height="131" rx="7"/>
<circle class="bb-mark" cx="930.7" cy="889" r="4"/>
<text class="bb-kicker" x="941.7" y="893">THEME</text>
<text class="bb-node-title" x="926.7" y="921">Prompts + themes</text>
<text class="bb-copy" x="926.7" y="946">templates, JSON themes</text>
</g>
