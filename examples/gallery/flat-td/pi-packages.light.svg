.iso-label-knockout{paint-order:stroke;stroke-width:6px;stroke-linejoin:round}
.bb-canvas{fill:#fbf9f6}
.bb-title,.bb-zone-title,.bb-node-title,.bb-meter-big,.bb-meter-unit{fill:#2f2a27}
.bb-subtitle,.bb-copy,.bb-hint,.bb-legend-text,.bb-meta,.bb-kicker,.bb-zone-kicker,.bb-kicker-top,.bb-zone-sub{fill:#716961}
